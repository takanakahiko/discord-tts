version: "2"
linters:
  default: all
  disable:
    - wsl # 余計な改行をなるべく含まないようにすることで得られる見通しの良さを重視するため
    - wsl_v5 # 上記と同様
    - nlreturn # 上記と同様
    - gosmopolitan # 現在はi18n/l10nを検討していないため
    - depguard # 規模的に依存関係の流れを厳格に管理する必要性はないため
    - forbidigo # いまのところ特に禁止したい表現はないため
    - noinlineerr # if err := ...; err != nil はGoの慣用的な書き方のため
    - exhaustruct # 非推奨になり exhaustruct_v5 に置き換わったため
    - gomodguard # 非推奨になり gomodguard_v2 に置き換わったため
  settings:
    varnamelen:
      ignore-decls:
        - v *discordgo.VoiceStateUpdate # パッケージの使用例がその命名であるため
        - m *discordgo.MessageCreate # パッケージの使用例がその命名であるため
    revive:
      rules:
        - name: unexported-return
          disabled: true # ireturnへの対応を優先するため
    funlen:
      lines: 100 # デフォルトの60だと余計な関数の分割が発生するため
      statements: 60 # デフォルトの40だと余計な関数の分割が発生するため
    gomoddirectives:
      replace-allow-list:
        - github.com/jonas747/dca # 該当パッケージが壊れているので独自にパッチを当てたものを利用したいため
    cyclop:
      max-complexity: 24 # デフォルトの10だと余計な関数の分割が発生するため
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
